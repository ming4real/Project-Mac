header:
  version: 18
    
# Core Repos for a Yocto Project  
repos:
  # BitBake Tools
  bitbake:
    url: https://git.openembedded.org/bitbake
    # yocto-6.0.4
    commit: 51fd94a67fa17650a9ff623492005972bbc7d26f
    path: layers/third-party/bitbake
    layers:
      # Bitbake is not a meta layer, it is only the tools
      bitbake: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    # yocto-6.0.4
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc
    path: layers/third-party/openembedded-core
    layers:
      meta:

  meta-openembedded:
    url: "https://github.com/openembedded/meta-openembedded.git"
    commit: "c0fcd7cca3760ef24e087ac4a31b8f357cb204da"
    path: "layers/third-party/meta-openembedded"
    layers:
      meta-oe:
      meta-python:
      meta-multimedia:
      meta-networking:
      meta-gnome:
      meta-xfce:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    # wrynose branch
    commit: b60511544c41f5d29d290681e15c9e302f747efe
    path: layers/third-party/meta-yocto
    layers:
      meta-yocto-bsp:

  meta-linux-mainline:
    url: https://github.com/betafive/meta-linux-mainline.git
    # wrynose
    commit: 0c65e5b781f061d20deda5e8fa284a80889458a3
    path: layers/third-party/meta-linux-mainline
    layers:
      .:

  meta-wayland:
    url: https://codeberg.org/flk/meta-wayland.git
    branch: wrynose
    commit: 2b97daa23e0e612a087ea54b150bd0b8e0ff9378
    path: layers/third-party/meta-wayland
      
  meta-mac:
    path: layers/my-layers/meta-mac

  meta-mac-distro:
    path: layers/project/meta-mac-distro

