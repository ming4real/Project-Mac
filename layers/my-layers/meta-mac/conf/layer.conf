# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mac"
BBFILE_PATTERN_meta-mac = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mac = "6"

LAYERDEPENDS_meta-mac = "core yoctobsp"
LAYERSERIES_COMPAT_meta-mac = "wrynose"
