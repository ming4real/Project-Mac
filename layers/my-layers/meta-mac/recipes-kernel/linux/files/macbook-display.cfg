CONFIG_FB_CORE=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_DRM_SIMPLEDRM=y

# For the USB Ethernet adapter
CONFIG_USB_RTL8152=m

# For the AMD GPU on the MacBook Pro 2018
CONFIG_DRM_AMDGPU=m

# For the Apple SPI keyboard and trackpad
CONFIG_SPI=y
CONFIG_SPI_PXA2XX=y
CONFIG_MFD_INTEL_LPSS_PCI=y
CONFIG_KEYBOARD_APPLESPI=y

# For the NVMe SSD on the MacBook
CONFIG_BLK_DEV_NVME=y