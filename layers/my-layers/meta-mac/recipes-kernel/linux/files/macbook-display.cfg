CONFIG_FB_CORE=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_DRM_SIMPLEDRM=y

# For the USB Ethernet adapter
CONFIG_USB_RTL8152=m

# For the AMD GPU on the MacBook Pro 2018
CONFIG_DRM_AMDGPU=m

# For the Apple SPI keyboard and trackpad
CONFIG_SPI=y
CONFIG_SPI_PXA2XX=y
CONFIG_MFD_INTEL_LPSS_PCI=y
CONFIG_KEYBOARD_APPLESPI=y

# For the NVMe SSD on the MacBook
CONFIG_BLK_DEV_NVME=y

# Needed for flatpak and sandboxing
CONFIG_USER_NS=y

# For the Broadcom Wi-Fi on the MacBook
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_PCIE=y

# For the touchbar on the MacBook
CONFIG_HID_APPLETB_KBD=m
CONFIG_HID_APPLETB_BL=m
CONFIG_DRM_APPLETBDRM=m

# For the Bluetooth on the MacBook
CONFIG_BT=m
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_HCIBTUSB=m
CONFIG_BT_HCIBTUSB_BCM=y
CONFIG_BT_BCM=m

# For the webcam on the MacBook
CONFIG_MEDIA_SUPPORT=y
CONFIG_MEDIA_USB_SUPPORT=y
CONFIG_VIDEO_DEV=y
CONFIG_USB_VIDEO_CLASS=m
CONFIG_MEDIA_CAMERA_SUPPORT=y

# Needed for the ambient light sensor and touchbar on the MacBook
CONFIG_IIO=y
CONFIG_IIO_TRIGGER=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_TRIGGERED_BUFFER=y